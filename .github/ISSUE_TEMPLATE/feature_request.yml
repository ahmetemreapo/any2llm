name: Feature request
description: Suggest a format, option, or integration.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the documents and the AI tool you use. A concrete example helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
