<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">any2llm</title>
  <desc id="desc">PDF, Word, and Excel documents flow into one Markdown file with page tags, and an AI chat answers with a page citation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b2547"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <g id="lines">
      <rect x="14" y="44" width="52" height="5" rx="2.5" fill="#c9d4e3"/>
      <rect x="14" y="58" width="44" height="5" rx="2.5" fill="#c9d4e3"/>
      <rect x="14" y="72" width="50" height="5" rx="2.5" fill="#c9d4e3"/>
      <rect x="14" y="86" width="34" height="5" rx="2.5" fill="#c9d4e3"/>
    </g>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="28" fill="url(#dots)"/>
  <rect x="40" y="150" width="600" height="24" fill="url(#glow)"/>

  <!-- Source documents -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="13" fill="#ffffff">
    <g transform="translate(64 62) rotate(-8 40 55)">
      <rect width="80" height="110" rx="10" fill="#f0f6fc"/>
      <rect x="10" y="12" width="40" height="20" rx="5" fill="#e5534b"/><text x="15" y="27">PDF</text>
      <use href="#lines"/>
    </g>
    <g transform="translate(108 128) rotate(5 40 55)">
      <rect width="80" height="110" rx="10" fill="#f0f6fc"/>
      <rect x="10" y="12" width="48" height="20" rx="5" fill="#4493f8"/><text x="14" y="27">DOCX</text>
      <use href="#lines"/>
    </g>
    <g transform="translate(176 52) rotate(9 40 55)">
      <rect width="80" height="110" rx="10" fill="#f0f6fc"/>
      <rect x="10" y="12" width="48" height="20" rx="5" fill="#2ea043"/><text x="14" y="27">XLSX</text>
      <use href="#lines"/>
    </g>
  </g>

  <!-- Trail -->
  <g fill="#e3b341">
    <circle cx="284" cy="162" r="5"/><circle cx="306" cy="162" r="5"/><circle cx="328" cy="162" r="5"/>
    <path d="M346 150 L364 162 L346 174 Z"/>
  </g>

  <!-- Markdown pack with page tags -->
  <g transform="translate(384 72)">
    <rect width="150" height="180" rx="14" fill="#0d1117" stroke="#58a6ff" stroke-width="3"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <text x="16" y="34" fill="#7ee787">&lt;page 1&gt;</text>
      <rect x="16" y="46" width="112" height="6" rx="3" fill="#30363d"/>
      <rect x="16" y="60" width="90" height="6" rx="3" fill="#30363d"/>
      <text x="16" y="96" fill="#7ee787">&lt;page 2&gt;</text>
      <rect x="16" y="108" width="104" height="6" rx="3" fill="#30363d"/>
      <text x="16" y="146" fill="#e3b341" font-weight="700">&lt;page 3&gt;</text>
      <rect x="16" y="158" width="118" height="6" rx="3" fill="#e3b341" fill-opacity="0.55"/>
    </g>
  </g>

  <!-- Chat answer with citation -->
  <g transform="translate(556 118)">
    <path d="M14 0 H130 a14 14 0 0 1 14 14 V58 a14 14 0 0 1 -14 14 H40 L22 90 L24 72 H14 a14 14 0 0 1 -14 -14 V14 a14 14 0 0 1 14 -14 Z" fill="#d2a8ff"/>
    <text x="72" y="45" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#2b1052">p. 3 ✓</text>
  </g>

  <!-- Wordmark -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="752" y="150" font-size="92" font-weight="800" fill="#f0f6fc" letter-spacing="-2">any<tspan fill="#e3b341">2</tspan>llm</text>
    <text x="756" y="200" font-size="27" font-weight="600" fill="#c9d4e3">Documents in. AI-ready Markdown out.</text>
    <text x="756" y="238" font-size="21" fill="#8b9bb4">PDF page numbers kept. Citations you can check.</text>
  </g>
</svg>
