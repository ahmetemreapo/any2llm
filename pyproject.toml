[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "any2llm"
version = "0.1.0"
description = "Select folder contents for LLM processing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ahmet Emre Apo"}]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pypdf", "python-docx>=1.1", "python-pptx", "openpyxl",
    "tiktoken", "questionary>=2.1", "rich", "pyperclip",
]

[project.urls]
Repository = "https://github.com/ahmetemreapo/any2llm"
Issues = "https://github.com/ahmetemreapo/any2llm/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
any2llm = "any2llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
any2llm = ["locales/*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
