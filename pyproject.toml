[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "any2llm"
version = "0.2.0"
description = "Pack mixed documents into Markdown batches for AI chats with original PDF page numbers"
readme = {file = "docs/pypi.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ahmet Emre Apo"}]
keywords = ["pdf", "docx", "pptx", "xlsx", "markdown", "llm", "ocr", "document-processing", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "pypdf", "python-docx>=1.1", "python-pptx", "openpyxl", "defusedxml>=0.7.1",
    "Pillow>=13.0.0",
    "tiktoken", "questionary>=2.1", "rich", "pyperclip",
]

[project.urls]
Repository = "https://github.com/ahmetemreapo/any2llm"
Documentation = "https://github.com/ahmetemreapo/any2llm/blob/main/docs/SPEC.md"
Issues = "https://github.com/ahmetemreapo/any2llm/issues"
Releases = "https://github.com/ahmetemreapo/any2llm/releases"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
any2llm = "any2llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
any2llm = ["locales/*.json", "demo_assets/*/*.pdf", "demo_assets/*/*.docx", "demo_assets/*/*.pptx", "demo_assets/*/*.xlsx"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
